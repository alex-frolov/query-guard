name: CI

on:
  push:
    branches: ['main']
  pull_request:

# a push to a branch with an open PR used to start the whole matrix twice; and a second
# push supersedes the first rather than queueing behind it
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: PHP ${{ matrix.php }}${{ matrix.deps == 'lowest' && ' / prefer-lowest' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        deps: ['highest']
        include:
          # the lower bound of support: PHPUnit 10.5, Doctrine ORM 2 / DBAL 3 —
          # the exact combination still found on real projects today
          - php: '8.2'
            deps: 'lowest'
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring, intl
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer/files
          key: composer-${{ matrix.php }}-${{ matrix.deps }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-${{ matrix.deps }}-

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress ${{ matrix.deps == 'lowest' && '--prefer-lowest' || '' }}

      - name: Show resolved versions
        run: composer show doctrine/dbal doctrine/orm phpunit/phpunit | head -20

      - name: PHPUnit
        run: vendor/bin/phpunit

  static:
    name: PHPStan (DBAL ${{ matrix.dbal }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dbal: '4'
            config: 'phpstan.neon.dist'
            constraint: '^4.0'
          - dbal: '3'
            config: 'tools/phpstan/dbal3.neon'
            constraint: '^3.9'
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      # The Driver → Connection → Statement wrappers exist in two variants, one per DBAL
      # generation, chosen at runtime. Both have to be analysed — under each version the
      # "other" variant is excluded
      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer/files
          key: composer-dbal${{ matrix.dbal }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-dbal${{ matrix.dbal }}-

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress --with "doctrine/dbal:${{ matrix.constraint }}"

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G --configuration=${{ matrix.config }}

      # The suite is analysed once, not per DBAL generation: it contains no version-split
      # wrappers of its own. One level below `src` — see tools/phpstan/tests.neon.
      - name: PHPStan (tests)
        if: matrix.dbal == '4'
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G --configuration=tools/phpstan/tests.neon

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, mbstring, intl
          coverage: pcov

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer/files
          key: composer-coverage-${{ hashFiles('composer.json') }}
          restore-keys: composer-coverage-

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      # A number in the log on every run, not a gate. There is deliberately no minimum:
      # the end-to-end tests launch PHPUnit in a child process, and a child process
      # contributes nothing to the parent's coverage — so `Extension` and the subscribers
      # read as uncovered even though they are the most thoroughly exercised code here.
      # A threshold over that figure would measure the wrong thing.
      - name: PHPUnit with coverage
        run: vendor/bin/phpunit --coverage-text --coverage-clover=coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-clover
          path: coverage.xml
          retention-days: 14

  codestyle:
    name: Code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer/files
          key: composer-codestyle-${{ hashFiles('composer.json') }}
          restore-keys: composer-codestyle-

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: PHP-CS-Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Validate composer.json
        run: composer validate --strict

  backward-compatibility:
    name: Backward compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # the tool diffs against the most recent tag, so it needs the tags and the
          # history behind them — the default shallow checkout has neither
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # the tool's own requirements, not this package's
          extensions: bcmath, intl
          coverage: none

      # Installed globally rather than added to composer.json: Roave brings a large
      # dependency tree of its own, and putting it beside phpstan and php-cs-fixer is how
      # this package would acquire the dependency conflict it currently does not have.
      #
      # Not the `docker://nyholm/roave-bc-check-ga` action, which is the obvious way to
      # do this and was tried first. That image pins nikic/php-parser 4, which cannot
      # read PHP 8.4 syntax, so every dependency using it turned into a parse warning:
      # 109 reported "changes" of which 98 were noise. It also runs as root over a
      # checkout owned by the runner, which git refuses to read at all. A global install
      # runs as the user that owns the checkout and carries a current parser.
      - name: Install Roave BC Check
        run: composer global require --no-interaction --no-progress roave/backward-compatibility-check

      # Roave answers "I found breaks" with exit code 3. Before 1.0 that is information,
      # not a failure, so the step tells 3 apart from the tool actually falling over and
      # reports the findings in the run summary.
      #
      # `continue-on-error: true` would be the one-line version and was what this job used
      # first. It is worse: it paints the check red on every run that finds anything, and
      # a check that is always red is a check nobody reads by the time 1.0 makes it mean
      # something. To make breaks blocking at 1.0, drop the `3` from the condition below.
      #
      # `--install-development-dependencies` because the ORMs are dev dependencies here:
      # without them the adapters' parent classes cannot be resolved and the comparison
      # skips those classes rather than judging them.
      - name: Roave BC check
        run: |
          bin="$(composer global config bin-dir --absolute)"
          tag="$(git describe --tags --abbrev=0)"

          set +e
          "$bin/roave-backward-compatibility-check" \
            --install-development-dependencies --format=markdown > bc.md
          status=$?
          set -e

          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then
            echo "roave-backward-compatibility-check itself failed with exit $status" >&2
            exit "$status"
          fi

          # the report starts at its first heading; composer's own chatter precedes it
          {
            echo "## Backward compatibility since ${tag}"
            echo
            if [ "$status" -eq 0 ]; then
              echo "Nothing on this branch breaks the released API."
            else
              echo "This branch breaks the API released in \`${tag}\`. Before 1.0 that is allowed —"
              echo "but every line below has to appear in \`CHANGELOG.md\` before this is merged."
              echo
              sed -n '/^# /,$p' bc.md
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

  tier2:
    name: Tier 2 / ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mysql
            driver: pdo_mysql
            extension: pdo_mysql
          - platform: postgres
            driver: pdo_pgsql
            extension: pdo_pgsql
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: stand
          MYSQL_DATABASE: stand
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -uroot -pstand"
          --health-interval=5s --health-timeout=5s --health-retries=30
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: stand
          POSTGRES_DB: stand
          POSTGRES_USER: stand
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U stand -d stand"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ${{ matrix.extension }}, pdo_sqlite, mbstring, intl
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer/files
          key: composer-tier2-${{ hashFiles('composer.json') }}
          restore-keys: composer-tier2-

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      # The tier 2 stand: 100 000 rows. On a fixture-sized database the plan rules are
      # not merely useless but harmful
      - name: Seed MySQL stand
        if: matrix.platform == 'mysql'
        run: mysql -h 127.0.0.1 -uroot -pstand stand < tools/stand/seed.mysql.sql

      - name: Seed PostgreSQL stand
        if: matrix.platform == 'postgres'
        env:
          PGPASSWORD: stand
        run: psql -h 127.0.0.1 -U stand -d stand -f tools/stand/seed.postgres.sql

      - name: Tier 2 tests
        env:
          QG_STAND_DRIVER: ${{ matrix.driver }}
          QG_STAND_HOST: 127.0.0.1
          QG_STAND_USER: ${{ matrix.platform == 'mysql' && 'root' || 'stand' }}
          QG_STAND_PASSWORD: stand
          QG_STAND_DB: stand
        run: vendor/bin/phpunit --testsuite integration --filter Tier2StandTest
